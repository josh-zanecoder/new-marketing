<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Marketing sample</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
  <div style="max-width:560px;margin:0 auto;padding:24px 20px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#222222;">
    <p style="margin:0 0 16px;">Dear {{ recipient.firstName }},</p>
    <p style="margin:0 0 16px;">
      I wanted to reach out personally with a quick update. Thank you for your time and for staying in touch.
    </p>
    <p style="margin:0 0 16px;">
      If you have any questions, just reply to this email — I am happy to help.
    </p>
    <p style="margin:0 0 4px;">Best regards,</p>
    <p style="margin:0;">{{ user.firstName }} {{ user.lastName }}</p>
  </div>
</body>
</html>
